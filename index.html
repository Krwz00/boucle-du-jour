<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boucle du jour</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  /* Layout : carte plein écran, panneau de commande flottant en bas */
  :root{
    --bg:#f6f4ee; --panel:#ffffff; --fg:#1d1b16; --muted:#6b665b;
    --line:#dcd7cb; --accent:#1f5a3a; --accent-fg:#ffffff; --route:#c8502b; --home:#1f5a3a;
    --font-display:"Georgia","Times New Roman",serif; --font-body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#15140f; --panel:#1f1d17; --fg:#eee9dc; --muted:#a39c8c; --line:#3a362c; --accent:#7fc99a; --accent-fg:#10261a; --route:#ff8a5c; --home:#7fc99a; color-scheme:dark }
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px}
  #map{position:absolute;inset:0;z-index:0}
  .panel{position:absolute;left:0;right:0;bottom:0;z-index:1000;background:var(--panel);border-top:1px solid var(--line);
    padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
    box-shadow:0 -6px 24px rgba(0,0,0,.12);max-height:62vh;overflow:auto}
  .head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
  h1{font-family:var(--font-display);font-size:22px;margin:0;font-weight:600;text-wrap:balance}
  .date{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.06em}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  .stat{border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
  .stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums;font-family:var(--font-display);font-weight:600}
  .stat span{font-size:12px;color:var(--muted)}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
  button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:8px;padding:9px 13px;cursor:pointer}
  button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  details{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
  summary{cursor:pointer;color:var(--muted);font-size:13px}
  label{display:block;font-size:13px;color:var(--muted);margin-top:8px}
  input{font:inherit;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);margin-top:4px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .msg{font-size:13px;color:var(--muted);margin-top:8px;min-height:1.2em}
  .turns{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--muted);max-height:22vh;overflow:auto}
  .turns li{margin:2px 0}
  @media (max-width:420px){.stats{grid-template-columns:repeat(3,1fr)}.stat b{font-size:17px}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="map" role="application" aria-label="Carte du trajet"></div>

<div class="panel">
  <div class="head">
    <h1>Boucle du jour</h1>
    <div class="date" id="dateLabel"></div>
  </div>
  <div class="stats">
    <div class="stat"><b id="sDist">–</b><span>kilomètres</span></div>
    <div class="stat"><b id="sSteps">–</b><span>pas estimés</span></div>
    <div class="stat"><b id="sTime">–</b><span>minutes</span></div>
  </div>
  <div class="row">
    <button class="primary" id="btnToday">Trajet du jour</button>
    <button id="btnReroll">Autre proposition</button>
    <button id="btnGmaps">Ouvrir dans Google Maps</button>
    <button id="btnGpx">Télécharger le GPX</button>
  </div>
  <div class="msg" id="msg"></div>
  <details>
    <summary>Réglages et étapes</summary>
    <label>Adresse de départ et d'arrivée
      <input id="addr" value="31 avenue de Saint-Ouen, 75017 Paris">
    </label>
    <div class="grid2">
      <label>Objectif en pas <input id="steps" type="number" value="10000" min="1000" step="500"></label>
      <label>Longueur de foulée (m) <input id="stride" type="number" value="0.75" min="0.5" max="1.1" step="0.01"></label>
    </div>
    <div class="row"><button id="btnApply">Appliquer et recalculer</button></div>
    <ol class="turns" id="turns"></ol>
  </details>
</div>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const OSRM="https://router.project-osrm.org/route/v1/foot/";
  let home={lat:48.8880,lon:2.3263}; // 31 av. de Saint-Ouen, Paris 17e
  let map, routeLayer, markers=[], current=null, variant=0;

  // Graine déterministe : même jour = même trajet ; "Autre proposition" incrémente la variante
  function seedFor(dateStr,v){let h=2166136261;for(const c of (dateStr+"#"+v)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
  function rng(seed){return function(){seed=(seed+0x6D2B79F5)|0;let t=Math.imul(seed^(seed>>>15),1|seed);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
  function todayStr(){const d=new Date();return d.toISOString().slice(0,10)}

  function offset(p,bearingDeg,distM){
    const R=6371000,b=bearingDeg*Math.PI/180,la1=p.lat*Math.PI/180,lo1=p.lon*Math.PI/180,d=distM/R;
    const la2=Math.asin(Math.sin(la1)*Math.cos(d)+Math.cos(la1)*Math.sin(d)*Math.cos(b));
    const lo2=lo1+Math.atan2(Math.sin(b)*Math.sin(d)*Math.cos(la1),Math.cos(d)-Math.sin(la1)*Math.sin(la2));
    return {lat:la2*180/Math.PI,lon:lo2*180/Math.PI};
  }

  // Points de passage : 3 sommets d'un triangle irrégulier autour de la maison, orientés par la graine
  function waypoints(r,radius){
    const base=r()*360, n=3, pts=[];
    for(let i=0;i<n;i++){
      const ang=base+i*(360/n)+(r()-0.5)*50;
      const d=radius*(0.75+r()*0.5);
      pts.push(offset(home,ang,d));
    }
    return pts;
  }

  async function osrm(pts){
    const coords=[home,...pts,home].map(p=>p.lon+","+p.lat).join(";");
    const url=OSRM+coords+"?overview=full&geometries=geojson&steps=true";
    const res=await fetch(url); if(!res.ok) throw new Error("OSRM "+res.status);
    const j=await res.json(); if(j.code!=="Ok") throw new Error(j.message||j.code);
    return j.routes[0];
  }

  function targetMeters(){return (+$("steps").value||10000)*(+$("stride").value||0.75)}

  async function generate(v){
    variant=v; const target=targetMeters();
    $("msg").textContent="Calcul du trajet…";
    const r=rng(seedFor(todayStr(),v));
    // Rayon initial : périmètre d'un triangle ≈ 3·√3·R → R ≈ L/5.2, corrigé par le détour urbain (~1.25)
    let radius=target/5.2/1.25, route=null, pts=null;
    try{
      for(let i=0;i<4;i++){
        const rr=rng(seedFor(todayStr(),v)); // mêmes angles, rayon ajusté
        pts=waypoints(rr,radius);
        route=await osrm(pts);
        const ratio=target/route.distance;
        if(Math.abs(ratio-1)<0.04) break;
        radius*=Math.min(1.6,Math.max(0.6,ratio));
      }
    }catch(e){ $("msg").textContent="Le service d'itinéraire ne répond pas ("+e.message+"). Réessaie dans un instant."; return; }
    current={route,pts}; draw(); $("msg").textContent="";
  }

  function draw(){
    const {route,pts}=current;
    const stride=+$("stride").value||0.75;
    $("sDist").textContent=(route.distance/1000).toFixed(1).replace(".",",");
    $("sSteps").textContent=Math.round(route.distance/stride).toLocaleString("fr-FR");
    $("sTime").textContent=Math.round(route.distance/1000/4.8*60); // 4,8 km/h
    if(routeLayer) map.removeLayer(routeLayer);
    markers.forEach(m=>map.removeLayer(m)); markers=[];
    routeLayer=L.geoJSON(route.geometry,{style:{color:getComputedStyle(document.documentElement).getPropertyValue("--route").trim(),weight:5,opacity:.9}}).addTo(map);
    const hc=getComputedStyle(document.documentElement).getPropertyValue("--home").trim();
    markers.push(L.circleMarker([home.lat,home.lon],{radius:8,color:hc,fillColor:hc,fillOpacity:1}).bindTooltip("Départ / arrivée").addTo(map));
    pts.forEach((p,i)=>markers.push(L.circleMarker([p.lat,p.lon],{radius:5,color:hc,fillColor:"#fff",fillOpacity:1}).bindTooltip("Étape "+(i+1)).addTo(map)));
    map.fitBounds(routeLayer.getBounds(),{padding:[20,20]});
    const ol=$("turns"); ol.innerHTML="";
    route.legs.forEach(leg=>leg.steps.forEach(s=>{
      if(s.distance<25) return;
      const li=document.createElement("li");
      li.textContent=(s.name?s.name:"continuer")+" · "+Math.round(s.distance)+" m";
      ol.appendChild(li);
    }));
  }

  async function geocode(q){
    const res=await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&q="+encodeURIComponent(q),{headers:{"Accept-Language":"fr"}});
    const j=await res.json(); if(!j.length) throw new Error("adresse introuvable");
    return {lat:+j[0].lat,lon:+j[0].lon};
  }

  function gpx(){
    const c=current.route.geometry.coordinates;
    const d=todayStr();
    const trk=c.map(p=>`<trkpt lat="${p[1]}" lon="${p[0]}"></trkpt>`).join("\n");
    return `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Boucle du jour" xmlns="http://www.topografix.com/GPX/1/1"><trk><name>Boucle ${d}</name><trkseg>\n${trk}\n</trkseg></trk></gpx>`;
  }

  // Init
  map=L.map("map",{zoomControl:false}).setView([home.lat,home.lon],14);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
  L.control.zoom({position:"topright"}).addTo(map);
  $("dateLabel").textContent=new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});

  $("btnToday").onclick=()=>generate(0);
  $("btnReroll").onclick=()=>generate(variant+1);
  $("btnApply").onclick=async()=>{
    try{ home=await geocode($("addr").value); }catch(e){ $("msg").textContent="Adresse introuvable, point de départ inchangé."; }
    generate(0);
  };
  $("btnGmaps").onclick=()=>{
    if(!current) return;
    const pts=[home,...current.pts,home].map(p=>p.lat+","+p.lon);
    window.open("https://www.google.com/maps/dir/"+pts.join("/")+"/data=!4m2!4m1!3e2","_blank");
  };
  $("btnGpx").onclick=()=>{
    if(!current) return;
    const blob=new Blob([gpx()],{type:"application/gpx+xml"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="boucle-"+todayStr()+".gpx"; a.click();
  };

  // Mémorise les réglages
  try{ const s=JSON.parse(localStorage.getItem("boucle-settings")||"{}"); if(s.addr){$("addr").value=s.addr;} if(s.steps)$("steps").value=s.steps; if(s.stride)$("stride").value=s.stride; if(s.home) home=s.home; }catch(e){}
  ["addr","steps","stride"].forEach(id=>$(id).addEventListener("change",()=>{try{localStorage.setItem("boucle-settings",JSON.stringify({addr:$("addr").value,steps:$("steps").value,stride:$("stride").value,home}))}catch(e){}}));

  generate(0);
})();
</script>
</body>
</html>
